name: Tune worker water cost

on:
  push:
    branches:
      - rewrite/real-baritone-v2
    paths:
      - .github/workflows/tune-worker-water-cost.yml

permissions:
  contents: write

jobs:
  tune-and-verify:
    if: github.event.head_commit.message == 'Add worker water-cost tuning workflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: rewrite/real-baritone-v2
          fetch-depth: 0

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply modest water path cost
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          source_path = Path('src/main/java/dev/dudie/baritonehelper/entity/WorkerEntity.java')
          source = source_path.read_text(encoding='utf-8')

          candidates = (
              'this.setPathfindingMalus(PathType.WATER, 0.0F);',
              'this.setPathfindingMalus(BlockPathTypes.WATER, 0.0F);',
          )
          replacement_count = 0
          for candidate in candidates:
              if candidate in source:
                  source = source.replace(candidate, candidate.replace('0.0F', '1.0F'), 1)
                  replacement_count += 1

          if replacement_count != 1:
              raise SystemExit(
                  f'Expected exactly one generated WATER malus assignment, found {replacement_count}'
              )

          source_path.write_text(source, encoding='utf-8')

          report_path = Path('docs/development/water-navigation-patch.md')
          report = report_path.read_text(encoding='utf-8') if report_path.exists() else ''
          report = report.replace('- Water path malus: `0.0`.', '- Water path malus: `1.0` (usable but mildly disfavored versus dry ground).')
          report_path.parent.mkdir(parents=True, exist_ok=True)
          report_path.write_text(report, encoding='utf-8')
          PY

      - name: Run full clean build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Commit verified tuning
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/dev/dudie/baritonehelper/entity/WorkerEntity.java docs/development/water-navigation-patch.md
          git commit -m 'Tune worker water traversal cost'
          git push origin HEAD:rewrite/real-baritone-v2
