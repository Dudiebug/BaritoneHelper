name: Final verify worker water navigation

on:
  push:
    branches:
      - rewrite/real-baritone-v2
    paths:
      - .github/workflows/final-verify-worker-water.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.event.head_commit.message == 'Add final worker water verification workflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: rewrite/real-baritone-v2
          fetch-depth: 0

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='src/main/java/dev/dudie/baritonehelper/entity/WorkerEntity.java'
          grep -Fq 'BARITONEHELPER-WATER-NAVIGATION-BEGIN' "$SOURCE"
          grep -Fq 'AmphibiousPathNavigation' "$SOURCE"
          grep -Eq 'setPathfindingMalus\((PathType|BlockPathTypes)\.WATER, 1\.0F\);' "$SOURCE"
          grep -Eq 'setPathfindingMalus\((PathType|BlockPathTypes)\.WATER_BORDER, 0\.0F\);' "$SOURCE"
          grep -Fq 'BARITONEHELPER-SWIM-CONTROL-BEGIN' "$SOURCE"
          grep -Fq 'SmoothSwimmingMoveControl' "$SOURCE"

      - name: Run full clean build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Record final verified state
        shell: bash
        run: |
          mkdir -p docs/development
          cat > docs/development/worker-water-v2-verified.md <<EOF
          # Worker water navigation: final verified state

          A clean full Gradle build passed on `${GITHUB_SHA}` with the worker configured for:

          - `AmphibiousPathNavigation`;
          - water path malus `1.0`;
          - water-border malus `0.0`;
          - `SmoothSwimmingMoveControl` while in water;
          - restoration of the original movement controller on land.
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/development/worker-water-v2-verified.md
          git commit -m 'Record final verified worker water build'
          git push origin HEAD:rewrite/real-baritone-v2
