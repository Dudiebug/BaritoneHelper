name: Release Baritone Helper

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (must match gradle.properties)
        required: true
        type: string
        default: v3.2.0-rc.1

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Validate exact release tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          TAG="$RELEASE_TAG"
          test "$TAG" = "v$VERSION"
          test "$VERSION" = "3.2.0-rc.1"
          test "$(git describe --tags --exact-match HEAD)" = "$TAG"
          grep -Eq "^## ${VERSION}( - .*)?$" CHANGELOG.md

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify unit contracts
        run: ./gradlew clean test --no-daemon --console=plain

      - name: Verify NeoForge GameTests
        run: ./gradlew runGameTestServer --no-daemon --console=plain

      - name: Build and verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew build --no-daemon --console=plain
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          TAG="$RELEASE_TAG"
          test "$TAG" = "v$VERSION"
          test "$(git describe --tags --exact-match HEAD)" = "$TAG"
          test -f "build/libs/baritonehelper-$VERSION.jar"
          test -f "build/libs/baritonehelper-$VERSION-sources.jar"
          test "$(find build/libs -maxdepth 1 -type f -name "baritonehelper-$VERSION.jar" | wc -l)" = 1
          test "$(find build/libs -maxdepth 1 -type f -name "baritonehelper-$VERSION-sources.jar" | wc -l)" = 1
          test -f RELEASE_NOTES-3.2.0-rc.1.md
          sha256sum "build/libs/baritonehelper-$VERSION.jar" \
            "build/libs/baritonehelper-$VERSION-sources.jar" \
            | tee build/libs/SHA256SUMS

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          gh release create "$TAG" \
            "build/libs/baritonehelper-$VERSION.jar" \
            "build/libs/baritonehelper-$VERSION-sources.jar" \
            build/libs/SHA256SUMS \
            --title "Baritone Helper $TAG" \
            --verify-tag \
            --prerelease \
            --notes-file RELEASE_NOTES-3.2.0-rc.1.md

      - name: Verify published prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          RELEASE="$(gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets,url)"
          test "$(jq -r '.tagName' <<<"$RELEASE")" = "$TAG"
          test "$(jq -r '.isDraft' <<<"$RELEASE")" = "false"
          test "$(jq -r '.isPrerelease' <<<"$RELEASE")" = "true"
          jq -e --arg asset "baritonehelper-$VERSION.jar" \
            '.assets | any(.name == $asset)' <<<"$RELEASE"
          jq -e --arg asset "baritonehelper-$VERSION-sources.jar" \
            '.assets | any(.name == $asset)' <<<"$RELEASE"
          jq -e '.assets | any(.name == "SHA256SUMS")' <<<"$RELEASE"
