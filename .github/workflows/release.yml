name: Release Baritone Helper

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (must match gradle.properties)
        required: true
        default: v3.1.0

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify unit contracts
        run: ./gradlew clean test --no-daemon --console=plain

      - name: Verify NeoForge GameTests
        run: ./gradlew runGameTestServer --no-daemon --console=plain

      - name: Build and verify artifact
        run: |
          ./gradlew build --no-daemon --console=plain
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          test "$TAG" = "v$VERSION"
          test -f "build/libs/baritonehelper-$VERSION.jar"
          test -f "build/libs/baritonehelper-$VERSION-sources.jar"
          test "$(find build/libs -maxdepth 1 -type f -name "baritonehelper-$VERSION.jar" | wc -l)" = 1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          gh release create "$TAG" \
            "build/libs/baritonehelper-$VERSION.jar" \
            "build/libs/baritonehelper-$VERSION-sources.jar" \
            --title "Baritone Helper $TAG" \
            --generate-notes \
            --latest
