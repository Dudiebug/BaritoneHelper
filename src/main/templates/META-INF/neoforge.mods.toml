modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Dudiebug/BaritoneHelper/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Dudiebug/BaritoneHelper"
authors="Dudiebug"
description='''
Baritone Helper adds one persistent, owner-bound, invulnerable resource
collector. Configure or replace its block target, assign storage, and use the
server-authoritative controller dashboard to explicitly start, stop, inspect,
and troubleshoot collection. The helper can continue active jobs while its
owner is offline, but never fights, follows, or teleports to its owner.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
