modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Dudiebug/BuddyBot-NeoForge/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Dudiebug/BuddyBot-NeoForge"
authors="Dudiebug"
description='''
Baritone Helper adds one persistent, owner-bound collector. Configure it with
the Worker Controller to collect a block type, deposit into assigned storage,
and continue working while its owner is offline. Baritone Helper is
invulnerable, non-targetable, non-combatant, and never follows or teleports to
its owner.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
